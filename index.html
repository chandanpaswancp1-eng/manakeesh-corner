<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f1e6" />
  <meta name="description" content="Order from Manakeesh Corner. Your favourites, one click away." />
  <meta property="og:title" content="Manakeesh Corner — Order" />
  <meta property="og:description" content="Your favourites, one click away." />
  <meta property="og:image" content="food/cheese-zaatar.jpg" />
  <title>Manakeesh Corner — Order</title>
  <link rel="icon" href="logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #f7f1e6;
      --paper: #fffdf8;
      --ink: #2b241c;
      --muted: #7a6d5d;
      --gold: #c4a15a;
      --gold-deep: #8d6a32;
      --line: rgba(196, 161, 90, 0.35);
      --shadow: 0 10px 30px rgba(80, 55, 20, 0.08);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: Outfit, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(900px 420px at 50% -10%, #fff 0%, transparent 60%),
        linear-gradient(180deg, #fbf6ee 0%, var(--cream) 40%, #efe4d2 100%);
    }
    .wrap {
      width: min(440px, 100%);
      margin: 0 auto;
      padding: 22px 18px 36px;
    }
    .brand { text-align: center; animation: rise .55s ease both; }
    .logo {
      width: min(280px, 78%);
      height: auto;
      display: block;
      margin: 4px auto 8px;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 28px;
      line-height: 1;
      font-weight: 700;
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .tagline {
      margin: 0;
      color: var(--gold-deep);
      font-size: 15px;
      letter-spacing: 0.01em;
    }
    .hero {
      margin: 16px 0 8px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      animation: rise .7s ease .05s both;
    }
    .hero img {
      display: block;
      width: 100%;
      height: 196px;
      object-fit: cover;
    }
    .offer {
      display: none;
      margin: 12px 0 0;
      padding: 10px 14px;
      border-radius: 14px;
      background: #fff8ea;
      border: 1px solid var(--line);
      color: var(--gold-deep);
      font-size: 14px;
      text-align: center;
    }
    .offer.show { display: block; }
    h2 {
      font-size: 13px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      text-align: center;
      color: var(--gold-deep);
      margin: 20px 0 12px;
      font-weight: 600;
    }
    .branches {
      display: none;
      gap: 8px;
      margin-bottom: 12px;
    }
    .branches.show { display: flex; flex-wrap: wrap; }
    .branch {
      flex: 1;
      min-width: 120px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      border-radius: 999px;
      padding: 10px 12px;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .branch.active {
      background: var(--ink);
      color: #f7f1e6;
      border-color: var(--ink);
    }
    .stack { display: grid; gap: 10px; }
    .btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 64px;
      padding: 12px 14px;
      border-radius: 18px;
      text-decoration: none;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:active { transform: scale(0.985); }
    .btn .mark {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      flex: none;
      color: #fff;
    }
    .btn .mark svg { width: 22px; height: 22px; display: block; }
    .btn .copy { display: flex; flex-direction: column; min-width: 0; }
    .btn strong { font-size: 16px; font-weight: 600; }
    .btn span { font-size: 12px; color: var(--muted); }
    .btn .go { margin-left: auto; color: var(--gold-deep); font-size: 18px; }
    .secondary { margin-top: 14px; }
    .secondary .btn { min-height: 54px; box-shadow: none; background: transparent; }
    .footer {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 22px;
    }
    .social {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      color: var(--gold-deep);
      background: var(--paper);
    }
    .social svg { width: 18px; height: 18px; }
    .fine {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 14px 0 0;
    }
    .stats {
      display: none;
      margin-top: 18px;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      font-size: 13px;
    }
    .stats.show { display: block; }
    .stats table { width: 100%; border-collapse: collapse; }
    .stats td { padding: 6px 0; border-bottom: 1px solid #f0e6d6; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    @media (min-width: 720px) {
      .wrap { padding-top: 40px; }
      .hero img { height: 230px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <img class="logo" id="logo" alt="Manakeesh Corner" />
      <h1 id="name">Manakeesh Corner</h1>
      <p class="tagline" id="tagline">Your favourites, one click away.</p>
    </header>
    <figure class="hero">
      <img id="hero" alt="" />
    </figure>
    <p class="offer" id="offer"></p>
    <h2>Choose your platform to order</h2>
    <div class="branches" id="branches"></div>
    <div class="stack" id="platforms"></div>
    <div class="stack secondary" id="secondary"></div>
    <footer class="footer" id="social"></footer>
    <p class="fine" id="fine"></p>
    <section class="stats" id="stats"></section>
  </main>
  <script src="config.js"></script>
  <script>
    const C = window.MANAKEESH || {};
    const PLATFORMS = [
      { key: "direct", name: "Order Direct", hint: "Order from the restaurant", color: "#8d6a32" },
      { key: "talabat", name: "Talabat", hint: "Delivered with Talabat", color: "#ff5a00" },
      { key: "deliveroo", name: "Deliveroo", hint: "Delivered with Deliveroo", color: "#00b8a9" },
      { key: "careem", name: "Careem", hint: "Delivered with Careem", color: "#0b8f4d" },
      { key: "noon", name: "Noon Food", hint: "Delivered with noon", color: "#111111" },
      { key: "whatsapp", name: "Order on WhatsApp", hint: "Message the restaurant", color: "#1f7a45" }
    ];

    function source() {
      const q = new URLSearchParams(location.search);
      const utm = q.get("utm_source");
      if (utm) return utm.toLowerCase();
      const ref = (document.referrer || "").toLowerCase();
      if (ref.includes("instagram")) return "instagram";
      if (ref.includes("facebook") || ref.includes("fb.")) return "facebook";
      if (ref.includes("whatsapp") || ref.includes("wa.me")) return "whatsapp";
      if (ref) return "referral";
      return "direct";
    }

    function track(platform) {
      const event = { platform, source: source(), at: new Date().toISOString() };
      try {
        const all = JSON.parse(localStorage.getItem("mc-clicks") || "[]");
        all.push(event);
        localStorage.setItem("mc-clicks", JSON.stringify(all.slice(-500)));
      } catch (e) {}
      if (window.gtag) gtag("event", "order_click", { platform, traffic_source: event.source });
    }

    function icon(key) {
      const paths = {
        direct: "MC",
        talabat: "T",
        deliveroo: "D",
        careem: "C",
        noon: "n",
        whatsapp: "W",
        menu: "≡",
        maps: "⌖",
        call: "☎"
      };
      return '<span style="font-weight:700;font-size:16px;letter-spacing:-0.03em">' + (paths[key] || "•") + "</span>";
    }

    function button(href, label, hint, key, color) {
      const a = document.createElement("a");
      a.className = "btn";
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener";
      a.innerHTML = '<span class="mark" style="background:' + color + '">' + icon(key) + '</span><span class="copy"><strong>' + label + '</strong><span>' + hint + '</span></span><span class="go">›</span>';
      a.addEventListener("click", function () { track(label); });
      return a;
    }

    function renderBranch(branch) {
      const box = document.getElementById("platforms");
      const extra = document.getElementById("secondary");
      box.innerHTML = "";
      extra.innerHTML = "";
      PLATFORMS.forEach(function (p) {
        const url = (branch.links && branch.links[p.key]) || "";
        if (!url) return;
        box.appendChild(button(url, p.name, p.hint, p.key, p.color));
      });
      const menu = branch.menu || C.menu;
      const phone = branch.phone || C.phone;
      if (menu) extra.appendChild(button(menu, "View Menu", "See the menu", "menu", "#8d6a32"));
      if (branch.maps) extra.appendChild(button(branch.maps, "Find Us on Google Maps", branch.mapsLabel || branch.name, "maps", "#8d6a32"));
      if (phone) extra.appendChild(button("tel:" + phone.replace(/\s/g, ""), "Call Us", phone, "call", "#8d6a32"));
      document.getElementById("fine").textContent = branch.name ? branch.name : "";
    }

    function init() {
      document.getElementById("name").textContent = C.name || "Manakeesh Corner";
      document.getElementById("tagline").textContent = C.tagline || "";
      document.getElementById("logo").src = C.logo;
      document.getElementById("logo").alt = C.name || "Logo";
      document.getElementById("hero").src = C.hero;
      document.getElementById("hero").alt = C.heroAlt || "";
      document.title = (C.name || "Manakeesh Corner") + " — Order";
      if (C.offer) {
        const offer = document.getElementById("offer");
        offer.textContent = C.offer;
        offer.classList.add("show");
      }
      const branches = C.branches || [];
      if (branches.length > 1) {
        const picker = document.getElementById("branches");
        picker.classList.add("show");
        branches.forEach(function (b, i) {
          const btn = document.createElement("button");
          btn.className = "branch" + (i === 0 ? " active" : "");
          btn.type = "button";
          btn.textContent = b.name;
          btn.addEventListener("click", function () {
            picker.querySelectorAll(".branch").forEach(function (el) { el.classList.remove("active"); });
            btn.classList.add("active");
            renderBranch(b);
          });
          picker.appendChild(btn);
        });
      }
      if (branches[0]) renderBranch(branches[0]);
      const social = document.getElementById("social");
      if (C.instagram) {
        const a = document.createElement("a");
        a.className = "social";
        a.href = C.instagram;
        a.target = "_blank";
        a.rel = "noopener";
        a.setAttribute("aria-label", "Instagram");
        a.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/></svg>';
        a.addEventListener("click", function () { track("Instagram"); });
        social.appendChild(a);
      }
      if (C.facebook) {
        const a = document.createElement("a");
        a.className = "social";
        a.href = C.facebook;
        a.target = "_blank";
        a.rel = "noopener";
        a.setAttribute("aria-label", "Facebook");
        a.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v2H8v3h2v7h3v-7h3l1-3h-4V10c0-.6.4-1 1-1z"/></svg>';
        a.addEventListener("click", function () { track("Facebook"); });
        social.appendChild(a);
      }
      if (new URLSearchParams(location.search).has("stats")) renderStats();
      if (C.gaMeasurementId) {
        const s = document.createElement("script");
        s.async = true;
        s.src = "https://www.googletagmanager.com/gtag/js?id=" + C.gaMeasurementId;
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", C.gaMeasurementId);
      }
    }

    function renderStats() {
      const box = document.getElementById("stats");
      let all = [];
      try { all = JSON.parse(localStorage.getItem("mc-clicks") || "[]"); } catch (e) {}
      const counts = {};
      all.forEach(function (e) {
        const k = e.platform + " · " + e.source;
        counts[k] = (counts[k] || 0) + 1;
      });
      const rows = Object.keys(counts).sort().map(function (k) {
        return "<tr><td>" + k + "</td><td>" + counts[k] + "</td></tr>";
      }).join("");
      box.classList.add("show");
      box.innerHTML = "<strong>Clicks on this phone</strong><p>Add ?stats to the link. Counts stay on this device unless a Google Analytics ID is set in config.js.</p><table>" + (rows || "<tr><td>No clicks yet</td></tr>") + "</table>";
    }

    init();
  </script>
</body>
</html>
